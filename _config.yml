title: Alexander Boll
tagline: Postdoctoral Researcher, University of Bern
description: >
  Alexander Boll — Postdoctoral Researcher at the Software Engineering Group,
  University of Bern. Research on merge conflict resolution, software variability,
  and model-based software engineering with MATLAB/Simulink.
url: "https://alexanderboll.dev"
baseurl: ""
lang: en

# Cloudflare Web Analytics (cookieless). Paste the site token from
# Cloudflare dashboard -> Analytics & Logs -> Web Analytics to enable.
cloudflare_analytics_token: "e3e93121d61549c2aa18ac853e722bd7"

author:
  name: Alexander Boll
  email: alexander.boll@unibe.ch

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  papers:
    output: true
    permalink: /papers/:name/
  disclosures:
    output: true
    permalink: /disclosures/:name/

defaults:
  - scope:
      path: ""
      type: papers
    values:
      layout: paper
  - scope:
      path: ""
      type: disclosures
    values:
      layout: disclosure
  - scope:
      path: "google*.html"
    values:
      sitemap: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .claude
  - cv/          # CV generator sources (script, LaTeX template, build dir)
  - Makefile

sass:
  style: compressed
