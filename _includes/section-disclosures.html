<section id="disclosures">
  <h2>Disclosures</h2>
  <ul class="plain-list">
    {%- assign items = site.disclosures | sort: "date" | reverse -%}
    {%- for d in items -%}
      <li>
        <strong><a href="{{ d.url | relative_url }}">{{ d.title }}</a></strong>
        <div class="meta">{{ d.product }}{% if d.date %} &middot; {{ d.date | date: "%b %Y" }}{% endif %}{% if d.cve %} &middot; {{ d.cve }}{% endif %}</div>
      </li>
    {%- endfor -%}
  </ul>
</section>
